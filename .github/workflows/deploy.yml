# Deploy CiteTrace static export to Cloudflare Workers Assets.
# Production: https://citetrace.welchsoftware.net
#
# Required GitHub repo secrets (same names as DropToPhone / company site):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# Optional:
#   CLOUDFLARE_ZONE_ID — purge CDN for citetrace.welchsoftware.net after deploy

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-citetrace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Purge CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID secret is not set — skipping CDN purge."
            exit 0
          fi
          # Soft-fail: deploy already succeeded. Token may lack Zone.Cache Purge.
          HTTP=$(curl -sS -o /tmp/cf-purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["citetrace.welchsoftware.net"]}' || true)
          if [ "${HTTP}" = "200" ] && jq -e '.success == true' /tmp/cf-purge.json > /dev/null 2>&1; then
            echo "Purged CDN cache for citetrace.welchsoftware.net"
          else
            echo "::warning::CDN purge skipped or failed (HTTP ${HTTP}). Deploy is still live — grant Cache Purge on the API token if you want purge."
            cat /tmp/cf-purge.json 2>/dev/null || true
          fi
          exit 0
